version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Every dependency here is a devDependency, so this collapses routine
      # advisory and version churn into one PR per week instead of one per
      # package. Majors stay ungrouped: they need a deliberate look.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
